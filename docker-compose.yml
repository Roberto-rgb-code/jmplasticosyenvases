services:
  app:
    build: .
    container_name: jmplasticos-app
    ports:
      - "8080:80"
    environment:
      APP_NAME: "JM Plasticos y Envases"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: jmplasticos
      DB_USERNAME: jmplasticos
      DB_PASSWORD: secret
      CONTACT_PHONE: "555-0000"
      CONTACT_EMAIL: contacto@jmplasticos.local
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    networks:
      - jmplasticos

  db:
    image: mysql:8.0
    container_name: jmplasticos-db
    environment:
      MYSQL_DATABASE: jmplasticos
      MYSQL_USER: jmplasticos
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - jmplasticos

volumes:
  mysql_data:
  vendor_data:

networks:
  jmplasticos:
    driver: bridge
